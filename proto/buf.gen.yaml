version: v2
# Plugins are resolved from PATH; the Makefile prepends ./bin (protoc-gen-go,
# protoc-gen-go-grpc). protoc-gen-es runs via node from the root node_modules.
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: module=github.com/aegisbastion/aegisbastion/gen/go
  - local: protoc-gen-go-grpc
    out: gen/go
    opt: module=github.com/aegisbastion/aegisbastion/gen/go
  - local:
      - node
      - node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es
    out: gen/ts
    opt: target=ts
