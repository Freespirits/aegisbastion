<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Phish-Catcher</title>
    <style>
      body { font: 13px/1.45 system-ui, sans-serif; margin: 0; width: 340px; color: #17202a; }
      header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid #e3e8ee; }
      header h1 { font-size: 14px; margin: 0; flex: 1; }
      #verdict-pill { padding: 3px 10px; border-radius: 999px; font-weight: 600; font-size: 12px; text-transform: uppercase; }
      .clean { background: #e6f6ec; color: #1c7c3c; }
      .suspicious { background: #fdf3e0; color: #9a6a00; }
      .malicious { background: #fde7e7; color: #b42318; }
      .unknown { background: #eceff3; color: #5f6b7a; }
      main { padding: 10px 14px 14px; }
      #score { font-size: 22px; font-weight: 700; margin: 4px 0 2px; }
      #score small { font-size: 12px; color: #5f6b7a; font-weight: 400; }
      #meta { color: #5f6b7a; font-size: 11px; margin-bottom: 8px; }
      #explanations { margin: 0 0 12px; padding-left: 18px; }
      #explanations li { margin-bottom: 4px; }
      #actions { display: flex; gap: 8px; }
      button { cursor: pointer; border: 1px solid #c8d1dc; background: #fff; border-radius: 6px; padding: 6px 10px; font-size: 12px; }
      button.primary { background: #b42318; border-color: #b42318; color: #fff; }
      button:disabled { opacity: 0.5; cursor: default; }
      #url-form { display: flex; gap: 6px; margin-top: 12px; }
      #url-input { flex: 1; padding: 6px 8px; border: 1px solid #c8d1dc; border-radius: 6px; font-size: 12px; }
      #report-status { font-size: 11px; color: #1c7c3c; margin-top: 6px; min-height: 14px; }
      a { color: #1a5fb4; }
    </style>
  </head>
  <body>
    <header>
      <h1>Phish-Catcher</h1>
      <span id="verdict-pill" class="unknown">—</span>
    </header>
    <main>
      <div id="score">— <small>/ 100</small></div>
      <div id="meta"></div>
      <ol id="explanations"></ol>
      <div id="actions">
        <button id="report-btn" class="primary" disabled>Report this phish</button>
        <button id="options-btn" title="Options">Options</button>
      </div>
      <div id="report-status" role="status"></div>
      <form id="url-form">
        <input id="url-input" type="text" placeholder="Check a URL…" autocomplete="off" />
        <button type="submit">Check</button>
      </form>
    </main>
    <script src="dist/popup.js"></script>
  </body>
</html>
